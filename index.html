<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz San Valentín ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .photo-frame {
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
            border-radius: 50%;
            overflow: hidden;
            border: 8px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: float 3s ease-in-out infinite;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rose-container {
            margin: 20px 0;
            position: relative;
        }

        .rose {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            position: relative;
            animation: spin 4s ease-in-out infinite;
        }

        @keyframes spin {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(10deg); }
        }

        .petal {
            position: absolute;
            width: 40px;
            height: 50px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 50%, #c44569 100%);
            border-radius: 50% 50% 50% 0;
            transform-origin: 0 100%;
        }

        .petal:nth-child(1) { transform: rotate(0deg) translate(20px, -25px); }
        .petal:nth-child(2) { transform: rotate(72deg) translate(20px, -25px); }
        .petal:nth-child(3) { transform: rotate(144deg) translate(20px, -25px); }
        .petal:nth-child(4) { transform: rotate(216deg) translate(20px, -25px); }
        .petal:nth-child(5) { transform: rotate(288deg) translate(20px, -25px); }

        .center {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle, #ff9ff3 0%, #ff6b9d 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
        }

        .message {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 30px;
            animation: slideUp 1s ease-out 0.5s both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message p {
            color: #333;
            font-size: 1.3em;
            line-height: 1.8;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .panda-container {
            margin-top: 30px;
            animation: pandaSleep 3s ease-in-out infinite;
        }

        @keyframes pandaSleep {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .panda {
            width: 150px;
            height: 120px;
            margin: 0 auto;
            position: relative;
        }

        .panda-body {
            width: 100px;
            height: 80px;
            background: #f5f5f5;
            border-radius: 50%;
            position: absolute;
            top: 20px;
            left: 25px;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.1);
        }

        .panda-head {
            width: 80px;
            height: 70px;
            background: #f5f5f5;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 35px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .ear {
            width: 25px;
            height: 25px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 5px;
        }

        .ear.left { left: 5px; }
        .ear.right { right: 5px; }

        .eye-patch {
            width: 30px;
            height: 35px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 25px;
        }

        .eye-patch.left { left: 10px; transform: rotate(-10deg); }
        .eye-patch.right { right: 10px; transform: rotate(10deg); }

        .eye {
            width: 3px;
            height: 3px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 15px;
        }

        .eye.left { left: 8px; }
        .eye.right { right: 8px; }

        .snout {
            width: 15px;
            height: 12px;
            background: #f5f5f5;
            border-radius: 50%;
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
        }

        .nose {
            width: 8px;
            height: 6px;
            background: #000;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
        }

        .paw {
            width: 30px;
            height: 25px;
            background: #000;
            border-radius: 50%;
            position: absolute;
        }

        .paw.left { left: 15px; bottom: 15px; transform: rotate(-20deg); }
        .paw.right { right: 15px; bottom: 15px; transform: rotate(20deg); }

        .zzz {
            position: absolute;
            top: -30px;
            right: 10px;
            font-size: 1.5em;
            color: #764ba2;
            animation: zzz 2s ease-in-out infinite;
        }

        @keyframes zzz {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-10px); }
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <h1>💕 Feliz San Valentín 💕</h1>
        
        <div class="photo-frame">
            <img src="foto.jpg" alt="Foto especial">
        </div>

        <div class="rose-container">
            <div class="rose">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center"></div>
            </div>
        </div>

        <div class="message">
            <p>
                Feliz San Valentín, especial 💘 te quiero un montón, contigo todo se siente mejor. Tú sabes que eres bien importante pa' mí.
            </p>
            
            <div class="panda-container">
                <div class="panda">
                    <div class="zzz">Z z z</div>
                    <div class="panda-head">
                        <div class="ear left"></div>
                        <div class="ear right"></div>
                        <div class="eye-patch left">
                            <div class="eye left"></div>
                        </div>
                        <div class="eye-patch right">
                            <div class="eye right"></div>
                        </div>
                        <div class="nose"></div>
                        <div class="snout"></div>
                    </div>
                    <div class="panda-body">
                        <div class="paw left"></div>
                        <div class="paw right"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Crear corazones flotantes
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 5) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            document.getElementById('hearts').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        // Crear corazones periódicamente
        setInterval(createHeart, 500);
        
        // Crear algunos corazones iniciales
        for(let i = 0; i < 10; i++) {
            createHeart();
        }
    </script>
</body>
</html>
